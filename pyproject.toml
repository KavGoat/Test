[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf4py"
version = "1.0.0"
description = "Open a PDF, add and delete pages, move its markups and draw rectangles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.gui-scripts]
pdf4py = "pdf4py.app:main"

[tool.setuptools.packages.find]
include = ["pdf4py*"]
