[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markforge"
version = "1.0.0"
description = "A drawing-review markup editor: every markup a real PDF annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pint>=0.23",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# pypdf is here to check what MarkForge writes with a reader that is
# not the one that wrote it. Nothing in the application uses it.
dev = ["pytest>=7.4", "pypdf>=6.14,<7"]

[project.gui-scripts]
markforge = "markforge.app:main"

[tool.setuptools.packages.find]
include = ["markforge*"]

[tool.setuptools.package-data]
markforge = ["py.typed", "data/*.txt.gz"]
