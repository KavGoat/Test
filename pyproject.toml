[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markforge"
version = "1.0.0"
description = "A drawing-review markup editor: every markup a real PDF annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pint>=0.23",
    "pypdf>=6.14,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.gui-scripts]
markforge = "markforge.app:main"

[tool.setuptools.packages.find]
include = ["markforge*"]

[tool.setuptools.package-data]
markforge = ["py.typed", "data/*.txt.gz"]
