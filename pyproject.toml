[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcforge"
version = "1.0.0"
description = "PDF markup and live SMath-style calculations on engineering drawings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pymupdf>=1.24",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "sympy>=1.12",
]

[project.optional-dependencies]
# pypdf is here to check what CalcForge writes with a reader that is
# not the one that wrote it; pyHanko signs a test PDF and checks the
# signature still holds after CalcForge saves it. Nothing in the application
# uses either.
dev = ["pytest>=7.4", "pypdf>=6.14,<7", "hypothesis>=6", "pyhanko>=0.20"]

[project.gui-scripts]
calcforge = "calcforge.app:main"

[tool.setuptools.packages.find]
include = ["calcforge*"]

[tool.setuptools.package-data]
calcforge = ["py.typed", "data/*.txt.gz", "calc/ui/icons/*"]
